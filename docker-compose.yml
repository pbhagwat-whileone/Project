version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - env_prod
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

secrets:
  env_prod:
    file: .env.production
